<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Meu Portal de Entretenimento Digital</title>
<style>
	/* Transforma a div em um Contêiner Flex */
.container-flex {
  display: flex;
  justify-content: space-between; /* Distribui o espaço horizontal entre os itens */
  align-items: center;            /* Alinha os itens verticalmente ao centro */
  gap: 15px;                      /* Define um espaçamento de 15px entre os itens */
  background-color: #f0f0f0;
  padding: 20px;
}

/* Estilo básico para os itens filhos */
.item {
  background-color: #007bff;
  color: white;
  padding: 20px;
  border-radius: 5px;
}
</style>
</head>
<body>
<div class="container-flex">
	<div class="item">Item 1</div>
    <div class="item">Item 2</div>
    <div class="item">Item 3</div>
</div>
</body>
</html>
